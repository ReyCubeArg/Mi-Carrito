<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rey Cube | Carrito</title>
<style>
body{font-family:Arial,sans-serif;margin:0;padding:12px;color:#18202b}
button,a{border:0;border-radius:7px;padding:12px 16px;
background:#1689b5;color:white;text-decoration:none;
cursor:pointer;font-size:15px;display:inline-block}
.item{padding:14px 0;border-bottom:1px solid #ddd}
</style>
</head>
<body>
<div id="app">Cargando...</div>
<script>
const app=document.getElementById("app");
const params=new URLSearchParams(location.search);
const CART_KEY="reycube_cart_v2";
const CART_PAGE_URL=location.origin+location.pathname+"?cart=1";
const INSTAGRAM_URL="https://www.instagram.com/reycubearg/";
const money=n=>"$"+n.toLocaleString("es-AR");

function getCart(){
 try{return JSON.parse(localStorage.getItem(CART_KEY))||[]}
 catch(e){return []}
}
function saveCart(c){localStorage.setItem(CART_KEY,JSON.stringify(c))}
function node(tag,text,parent){
 const e=document.createElement(tag);
 e.textContent=text;
 parent.appendChild(e);
 return e;
}
function btn(text,parent,fn){
 const b=node("button",text,parent);
 b.style.margin="4px";
 b.onclick=fn;
 return b;
}

function productPage(){
 const name=params.get("name")||"Cubo Rey Cube";
const price = Number(new URLSearchParams(window.location.search).get("price") || 0);
 app.replaceChildren();
 node("h3",name,app);
 if(price>0)node("p",money(price)+" ARS",app);
 btn("＋ Agregar al carrito",app,()=>{
   if(!Number.isFinite(price)||price<=0){
     alert("El precio del producto no es válido.");
     return;
   }
   try{
     const c=getCart();
     const item=c.find(x=>x.name===name);
     if(item){item.qty++}
     else{c.push({name,price,qty:1})}
     saveCart(c);
     app.replaceChildren();
     node("p","¡Producto agregado al carrito!",app);
     const a=node("a","Ir a Mi carrito",app);
     a.href=CART_PAGE_URL;
   }catch(e){
     alert("El navegador bloqueó el carrito. Abrí esta página directamente en Chrome.");
   }
 });
}

function cartPage(){
 app.replaceChildren();
 node("h2","🛒 Mi carrito",app);
 const c=getCart();
 if(!c.length)node("p","Todavía no agregaste productos.",app);
 let total=0;
 c.forEach((p,i)=>{
   const row=node("div","",app);
   row.className="item";
   node("b",p.name,row);
   node("p",money(p.price)+" por unidad",row);
   btn("−",row,()=>{
     p.qty--;
     if(p.qty<=0)c.splice(i,1);
     saveCart(c);cartPage();
   });
   node("span"," Cantidad: "+p.qty+" ",row);
   btn("+",row,()=>{
     p.qty++;saveCart(c);cartPage();
   });
   btn("Eliminar",row,()=>{
     c.splice(i,1);saveCart(c);cartPage();
   });
   node("p","Subtotal: "+money(p.price*p.qty),row);
   total+=p.price*p.qty;
 });
 node("h3","Total: "+money(total)+" ARS",app);
 if(c.length){
   btn("Pedir por Instagram",app,()=>{
     const msg="¡Hola, Rey Cube! Quiero hacer este pedido:\n\n"+
       c.map(p=>"- "+p.name+" x"+p.qty+" = "+
       money(p.price*p.qty)+" ARS").join("\n")+
       "\n\nTotal: "+money(total)+
       " ARS\n¿Me confirman el stock y el envío?";
     app.querySelectorAll(".pedido").forEach(x=>x.remove());
     const box=node("div","",app);box.className="pedido";
     node("p","Copiá este mensaje y pegalo en Instagram:",box);
     const area=node("textarea","",box);
     area.value=msg;area.rows=8;area.style.width="100%";
     btn("Copiar pedido",box,async()=>{
       try{await navigator.clipboard.writeText(msg);alert("¡Pedido copiado!")}
       catch(e){area.select();alert("Seleccioná y copiá el texto.")}
     });
     const a=node("a","Abrir Instagram",box);
     a.href=INSTAGRAM_URL;a.target="_blank";
   });
   btn("Vaciar carrito",app,()=>{
     saveCart([]);cartPage();
   });
 }
}
if(params.get("cart")==="1")cartPage();
else productPage();
</script>
</body>
</html>
