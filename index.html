
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rey Cube | Carrito</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f5f8;color:#18202b;font-family:Arial,sans-serif}
main{max-width:680px;margin:25px auto;padding:14px}
.card{background:#fff;border-radius:14px;padding:22px;box-shadow:0 3px 15px #0001}
h1{margin-top:0;color:#1689b5}
h2{overflow-wrap:anywhere}
button{border:0;border-radius:8px;padding:12px 15px;font-size:15px;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
.primary{background:#1689b5;color:white}
.secondary{background:#e8edf2;color:#18202b}
.danger{background:#fee2e2;color:#991b1b}
.item{border-bottom:1px solid #e5e7eb;padding:15px 0}
.item:last-child{border-bottom:0}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.price,.total{font-weight:bold;font-size:21px}
.muted{color:#64748b;font-size:14px}
.status{padding:10px;background:#eef7fb;border-radius:8px}
</style>
</head>
<body>
<main>
<div class="card" id="app">Cargando Rey Cube...</div>
</main>
<script>
"use strict";

const app=document.getElementById("app");
const params=new URLSearchParams(location.search);
const CART_KEY="reycube_cart_v2";
const INSTAGRAM_URL="https://www.instagram.com/reycubearg/";
const BASE_URL=location.origin+location.pathname;

/* STOCK MANUAL: actualizá las cantidades cuando vendas o repongas */
const STOCK={
  "gan-251-m-pro-2x2":2,
  "mgc-beta-core-magnets-uv-2x2":3,
  "moyu-rs2m-2x2":0,
  "3x3-gan-17-magdrive-uv":1,
  "moyu v5 uv picube version":1,
  "3x3-rs3m-v5-ballcore-maglev-uv-robot":3,
  "3x3-weilong-v11-ballcore-8-imanes-uv":2,
  "3x3-rs3m-v5-ajuste-dual":4,
  "3x3-qy-warrior-m-uv":4,
  "3x3-qy-m-pro-v3-pioneer":2,
  "3x3-qy-m-pro-v3-flagship":2,
  "reycubearg/3x3-rs3m-2020":2,
  "3x3-aolong-v5-ballcore-20-imanes-maglev-uv":2,
  "qy-smart-cube-m-uv-3x3":2,
  "3x3-xman-tornado-v5-flagship-ballcore-uv":2,
  "qy-m-pro-v2-ballcore-uv-4x4":3,
  "moyu-rs4m-4x4":0,
  "5x5-qy-warrior-m-uv":3,
  "6x6-qy-m-pro-ballcore-uv":2,
  "7x7-qy-m-pro-ballcore-uv":2,
  "moyu-weilong-m-pyraminx":1,
  "moyu-jinzita-v2-m-pyraminx":1,
  "skewb-gan-enhanced-uv":2,
  "moyu-rs-maglev-skewb":2,
  "mgc-v1-magnetico-square-1":3,
  "pi-lube-yellow-10cc":2,
  "pi-lube-white-10cc":3,
  "pi-lube-blue-10cc":2,
  "pi-lube-black-10cc":2,
  "moyu-hand-bag":2,
  "timer-g5-speed-stacks":1,
  "qy-smart-timer":3,
  "qy-mat-pequeño":2,
  "mat-speed-stacks-g5":1,
  "qy-training-mat":2,
  "yj-yuhu-v3-megaminx-black-parts":2,
  "megaminx-yj-yuhu-v3-maglev-ballcore-ajuste-dual":2
};

function normalize(v){
  return String(v||"").trim().toLowerCase();
}
function money(v){
  return "$"+Number(v).toLocaleString("es-AR");
}
function el(tag,text,parent){
  const e=document.createElement(tag);
  if(text!==undefined)e.textContent=text;
  parent.appendChild(e);
  return e;
}
function btn(text,parent,fn,cls="secondary"){
  const b=el("button",text,parent);
  b.type="button";
  b.className=cls;
  b.addEventListener("click",fn);
  return b;
}
function getStock(id){
  const k=normalize(id);
  return Object.prototype.hasOwnProperty.call(STOCK,k)
    ? Math.max(0,Number(STOCK[k])||0) : null;
}
function readCart(){
  try{
    const c=JSON.parse(localStorage.getItem(CART_KEY)||"[]");
    return Array.isArray(c)?c:[];
  }catch(e){return [];}
}
function saveCart(c){
  localStorage.setItem(CART_KEY,JSON.stringify(c));
}
function cartQuantity(id){
  return readCart().filter(p=>normalize(p.stockId)===normalize(id))
    .reduce((n,p)=>n+Number(p.quantity||0),0);
}
function header(parent){
  el("h1","Rey Cube",parent);
  el("p","Tu tienda de cubos de Rubik",parent).className="muted";
}
function productPage(){
  const name=params.get("name")||"Cubo Rey Cube";
  const price=Number(params.get("price")||0);
  const stockId=params.get("stockid")||name;
  const stock=getStock(stockId);
  app.replaceChildren();
  header(app);
  el("h2",name,app);
  if(price>0)el("p",money(price)+" ARS",app).className="price";
  else el("p","Precio no configurado.",app);

  const status=el("p","",app);
  status.className="status";

  function update(){
    const remaining=stock===null?0:Math.max(0,stock-cartQuantity(stockId));
    if(stock===null)status.textContent="Stock no configurado para este producto.";
    else if(remaining>0)status.textContent="Unidades disponibles para agregar: "+remaining;
    else status.textContent="Sin unidades disponibles para agregar.";
    add.disabled=stock===null||remaining<=0||price<=0;
  }

  const add=btn("Agregar al carrito",app,()=>{
    if(stock===null){
      status.textContent="Stock no configurado. Revisá el stockid del enlace.";
      return;
    }
    if(price<=0){status.textContent="El precio no es válido.";return;}
    if(cartQuantity(stockId)>=stock){update();return;}

    const cart=readCart();
    const found=cart.find(p=>normalize(p.stockId)===normalize(stockId));
    if(found){
      found.quantity=Number(found.quantity||0)+1;
      found.name=name;
      found.price=price;
    }else{
      cart.push({stockId,name,price,quantity:1});
    }
    saveCart(cart);
    update();
    status.textContent="¡Producto agregado al carrito!";
  },"primary");

  btn("Ver carrito",app,()=>{location.href=BASE_URL+"?cart=1";});
  update();
}
function cartPage(){
  app.replaceChildren();
  header(app);
  el("h2","Tu carrito",app);
  const list=el("div",undefined,app);
  const totalText=el("p","",app);
  totalText.className="total";
  const status=el("p","",app);
  status.className="status";
  status.hidden=true;

  function render(){
    list.replaceChildren();
    const cart=readCart();
    if(cart.length===0){
      el("p","Tu carrito está vacío.",list);
      totalText.textContent="Total: $0";
      return;
    }
    let total=0;
    cart.forEach(item=>{
      const quantity=Number(item.quantity)||0;
      const price=Number(item.price)||0;
      const stock=getStock(item.stockId);
      total+=quantity*price;
      const box=el("div",undefined,list);
      box.className="item";
      el("h3",item.name,box);
      el("p",money(price)+" por unidad",box);
      const row=el("div",undefined,box);
      row.className="row";
      const controls=el("div",undefined,row);
      controls.className="buttons";
      btn("−",controls,()=>{
        const c=readCart();
        const p=c.find(x=>normalize(x.stockId)===normalize(item.stockId));
        if(p)p.quantity--;
        saveCart(c.filter(x=>Number(x.quantity)>0));
        render();
      });
      el("span","Cantidad: "+quantity,controls);
      btn("+",controls,()=>{
        const c=readCart();
        const p=c.find(x=>normalize(x.stockId)===normalize(item.stockId));
        if(!p)return;
        const current=cartQuantity(item.stockId);
        if(stock===null||current>=stock){
          status.hidden=false;
          status.textContent=stock===null
            ?"Stock no configurado para "+item.name+"."
            :"No hay más unidades disponibles de "+item.name+".";
          return;
        }
        p.quantity++;
        saveCart(c);
        status.hidden=true;
        render();
      },"primary");
      btn("Eliminar",controls,()=>{
        saveCart(readCart().filter(x=>normalize(x.stockId)!==normalize(item.stockId)));
        render();
      },"danger");
      el("p","Subtotal: "+money(quantity*price),box);
    });
    totalText.textContent="Total: "+money(total)+" ARS";
  }

  const actions=el("div",undefined,app);
  actions.className="buttons";
  btn("Seguir comprando",actions,()=>{location.href=BASE_URL;});
  btn("Vaciar carrito",actions,()=>{
    saveCart([]);
    render();
    status.hidden=false;
    status.textContent="Carrito vaciado correctamente.";
  },"danger");
  btn("Pedir por Instagram",actions,()=>{
    const cart=readCart();
    if(!cart.length){
      status.hidden=false;
      status.textContent="Tu carrito está vacío.";
      return;
    }
    const lines=cart.map(p=>p.name+" x"+p.quantity+" — "+money(p.price*p.quantity));
    const total=cart.reduce((n,p)=>n+Number(p.price)*Number(p.quantity),0);
    const message="Hola Rey Cube, quiero hacer este pedido:\n"+
      lines.join("\n")+"\nTotal: "+money(total)+" ARS";
    status.hidden=false;
    status.textContent="Se abrirá Instagram. Copiá y enviá este resumen:\n"+message;
    window.open(INSTAGRAM_URL,"_blank","noopener");
  },"primary");
  render();
}
if(params.get("cart")==="1")cartPage();
else productPage();
</script>
</body>
</html>
