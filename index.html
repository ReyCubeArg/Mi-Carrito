
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rey Cube | Carrito</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;margin:0;background:#f4f6f8;color:#18202b}
main{max-width:700px;margin:24px auto;padding:16px}
.card{background:white;padding:22px;border-radius:14px;box-shadow:0 3px 14px #00000010}
h1{font-size:25px;margin:0 0 8px}
h2{font-size:21px}
p{line-height:1.5}
button{border:0;border-radius:8px;padding:11px 15px;cursor:pointer;font-size:15px}
.primary{background:#1689b5;color:white}
.secondary{background:#e8edf1;color:#18202b}
.danger{background:#fee2e2;color:#991b1b}
button:disabled{opacity:.45;cursor:not-allowed}
.item{border-bottom:1px solid #e5e7eb;padding:15px 0}
.item:last-child{border-bottom:0}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.muted{color:#64748b;font-size:14px}
.price{font-size:21px;font-weight:bold;margin:15px 0}
.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.total{font-size:23px;font-weight:bold;margin:22px 0}
a{color:#087ca5}
</style>
</head>
<body>
<main>
<div class="card" id="app">Cargando...</div>
</main>

<script>
"use strict";

const app=document.getElementById("app");
const params=new URLSearchParams(location.search);
const CART_KEY="reycube_cart_v2";
const INSTAGRAM_URL="https://www.instagram.com/reycubearg/";
const CART_PAGE_URL=location.origin+location.pathname+"?cart=1";

/* INVENTARIO MANUAL DE REY CUBE
   Modificá los números según tus existencias.
   Cada clave es un identificador de stock.
*/
const STOCK={
  "gan-251-m-pro-2x2":2,
  "mgc-beta-core-magnets-uv-2x2":3,
  "moyu-rs2m-2x2":0,
  "3x3-gan-17-magdrive-uv":1,
  "moyu v5 uv picube version":1,
  "3x3-rs3m-v5-ballcore-maglev-uv-robot":3,
  "3x3-weilong-v11-ballcore-8-imanes-uv":2,
  "3x3-rs3m-v5-ajuste-dual":4,
  "3x3-qy-warrior-m-uv":4,
  "3x3-qy-m-pro-v3-pioneer":2,
  "3x3-qy-m-pro-v3-flagship":2,
  "reycubearg/3x3-rs3m-2020":2,
  "3x3-aolong-v5-ballcore-20-imanes-maglev-uv":2,
  "qy-smart-cube-m-uv-3x3":2,
  "3x3-xman-tornado-v5-flagship-ballcore-uv":2,
  "qy-m-pro-v2-ballcore-uv-4x4":3,
  "moyu-rs4m-4x4":0,
  "5x5-qy-warrior-m-uv":3,
  "6x6-qy-m-pro-ballcore-uv":2,
  "7x7-qy-m-pro-ballcore-uv":2,
  "moyu-weilong-m-pyraminx":1,
  "moyu-jinzita-v2-m-pyraminx":1,
  "skewb-gan-enhanced-uv":2,
  "moyu-rs-maglev-skewb":2,
  "mgc-v1-magnetico-square-1":3,
  "pi-lube-yellow-10cc":2,
  "pi-lube-white-10cc":3,
  "pi-lube-blue-10cc":2,
  "pi-lube-black-10cc":2,
  "moyu-hand-bag":2,
  "timer-g5-speed-stacks":1,
  "qy-smart-timer":3,
  "qy-mat-pequeño":2,
  "mat-speed-stacks-g5":1,
  "qy-training-mat":2,
  "yj-yuhu-v3-megaminx-black-parts":2,
  "megaminx-yj-yuhu-v3-maglev-ballcore-ajuste-dual":2
};

function normalize(value){
  return String(value||"").trim().toLowerCase();
}

function getStock(stockId){
  const key=normalize(stockId);
  return Object.prototype.hasOwnProperty.call(STOCK,key)
    ? Number(STOCK[key])
    : 0;
}

function money(value){
  return "$"+Number(value).toLocaleString("es-AR");
}

function node(tag,text,parent){
  const el=document.createElement(tag);
  if(text!==undefined)el.textContent=text;
  parent.appendChild(el);
  return el;
}

function button(text,parent,callback,cls="secondary"){
  const el=node("button",text,parent);
  el.type="button";
  el.className=cls;
  el.addEventListener("click",callback);
  return el;
}

function readCart(){
  try{
    const data=JSON.parse(localStorage.getItem(CART_KEY)||"[]");
    return Array.isArray(data)?data:[];
  }catch(error){
    return [];
  }
}

function saveCart(cart){
  localStorage.setItem(CART_KEY,JSON.stringify(cart));
}

function quantityInCart(stockId){
  return readCart()
    .filter(item=>normalize(item.stockId)===normalize(stockId))
    .reduce((sum,item)=>sum+Number(item.quantity||0),0);
}

function productPage(){
  const name=params.get("name")||"Cubo Rey Cube";
  const price=Number(params.get("price")||0);
  const stockId=params.get("stockid")||"";
  const stock=getStock(stockId);

  app.replaceChildren();

  node("h1","Rey Cube",app);
  node("p","Tu tienda de cubos de Rubik",app);
  node("h2",name,app);

  if(price>0){
    node("p",money(price)+" ARS",app).className="price";
  }else{
    node("p","Precio no configurado.",app);
  }

  const info=node("p","",app);
  const add=button("Agregar al carrito",app,addToCart,"primary");
  const goCart=button("Ver carrito",app,()=>{
    location.href=CART_PAGE_URL;
  });

  function remaining(){
    return Math.max(0,stock-quantityInCart(stockId));
  }

  function refresh(){
    const available=remaining();

    if(!stockId||!Object.prototype.hasOwnProperty.call(STOCK,normalize(stockId))){
      info.textContent="Stock no configurado para este producto.";
    }else if(available>0){
      info.textContent="Unidades disponibles para agregar: "+available;
    }else{
      info.textContent="Sin unidades disponibles para agregar.";
    }

    add.disabled=available<=0||price<=0||!stockId;
  }

  function addToCart(){
    if(!stockId||!Object.prototype.hasOwnProperty.call(STOCK,normalize(stockId))){
      alert("Este producto no tiene stock configurado.");
      return;
    }

    if(price<=0){
      alert("Este producto no tiene un precio válido.");
      return;
    }

    if(remaining()<=0){
      alert("No hay más unidades disponibles.");
      refresh();
      return;
    }

    const cart=readCart();
    const existing=cart.find(item=>
      normalize(item.stockId)===normalize(stockId)
    );

    if(existing){
      existing.quantity=Number(existing.quantity||0)+1;
      existing.name=name;
      existing.price=price;
    }else{
      cart.push({
        stockId:stockId,
        name:name,
        price:price,
        quantity:1
      });
    }

    saveCart(cart);
    refresh();
    alert("Producto agregado al carrito.");
  }

  refresh();
}

function cartPage(){
  app.replaceChildren();

  node("h1","Rey Cube",app);
  node("h2","Tu carrito",app);

  const content=node("div",undefined,app);
  const totalEl=node("p","",app);
  totalEl.className="total";

  function render(){
    content.replaceChildren();
    const cart=readCart();

    if(cart.length===0){
      node("p","Tu carrito está vacío.",content);
      totalEl.textContent="Total: $0";
      return;
    }

    let total=0;

    cart.forEach(item=>{
      const price=Number(item.price)||0;
      const quantity=Number(item.quantity)||0;
      const stock=getStock(item.stockId);
      total+=price*quantity;

      const row=node("div",undefined,content);
      row.className="item";

      const title=node("h3",item.name,row);
      title.style.margin="0 0 8px";

      node("p",money(price)+" c/u",row);

      const controls=node("div",undefined,row);
      controls.className="row";

      const qty=node("div",undefined,controls);
      qty.className="actions";

      button("−",qty,()=>{
        const latest=readCart();
        const found=latest.find(p=>
          normalize(p.stockId)===normalize(item.stockId)
        );
        if(found){
          found.quantity--;
          if(found.quantity<=0){
            saveCart(latest.filter(p=>
              normalize(p.stockId)!==normalize(item.stockId)
            ));
          }else{
            saveCart(latest);
          }
        }
        render();
      });

      node("span","Cantidad: "+quantity,qty);

      button("+",qty,()=>{
        const latest=readCart();
        const found=latest.find(p=>
          normalize(p.stockId)===normalize(item.stockId)
        );

        if(!found)return;

        const otherQuantity=latest
          .filter(p=>normalize(p.stockId)===normalize(item.stockId))
          .reduce((sum,p)=>sum+Number(p.quantity||0),0);

        if(otherQuantity>=stock){
          alert("No podés agregar más unidades: alcanzaste el stock disponible.");
          return;
        }

        found.quantity++;
        saveCart(latest);
        render();
      }, "primary");

      button("Eliminar",controls,()=>{
        saveCart(readCart().filter(p=>
          normalize(p.stockId)!==normalize(item.stockId)
        ));
        render();
      },"danger");

      node("p","Subtotal: "+money(price*quantity),row);
    });

    totalEl.textContent="Total: "+money(total)+" ARS";
  }

  button("Seguir comprando",app,()=>{
    location.href=location.origin+location.pathname;
  });

  button("Vaciar carrito",app,()=>{
    if(confirm("¿Querés vaciar el carrito?")){
      saveCart([]);
      render();
    }
  },"danger");

  button("Pedir por Instagram",app,()=>{
    const cart=readCart();
    if(cart.length===0){
      alert("Tu carrito está vacío.");
      return;
    }

    const summary=cart.map(item=>
      item.name+" x"+item.quantity+" - "+money(item.price*item.quantity)
    ).join("\n");

    const text="Hola Rey Cube, quiero hacer este pedido:\n"+
      summary+"\nTotal: "+totalEl.textContent.replace("Total: ","");

    try{
      if(navigator.clipboard&&navigator.clipboard.writeText){
        navigator.clipboard.writeText(text);
      }
    }catch(error){}

    alert("Si el resumen se copió, podés pegarlo en el chat de Instagram.");
    window.open(INSTAGRAM_URL,"_blank","noopener");
  },"primary");

  render();
}

if(params.get("cart")==="1"){
  cartPage();
}else{
  productPage();
}
</script>
</body>
</html>
